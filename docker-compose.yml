version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shopsphere_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopsphere_db
      POSTGRES_USER: shopsphere_user
      POSTGRES_PASSWORD: shopsphere_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere_user -d shopsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-dev-shopsphere-compose-key"
      DATABASE_URL: "postgresql://shopsphere_user:shopsphere_pass@db:5432/shopsphere_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
